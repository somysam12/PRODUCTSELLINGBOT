<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#10b981">
<title>We'll be right back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{color-scheme:light}
  body{
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:24px;color:#211e18;overflow:hidden;position:relative;
    background:radial-gradient(ellipse 90% 55% at 15% -5%,#f2ede4 0,transparent 55%),
               radial-gradient(ellipse 70% 45% at 100% 8%,#ece5d9 0,transparent 52%),#e7e1d6;
  }
  /* soft drifting ambient blobs */
  body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none}
  body::before{width:46vw;height:46vw;left:-12vw;top:-10vw;background:radial-gradient(circle,rgba(16,185,129,.22),transparent 70%);animation:drift1 16s ease-in-out infinite alternate}
  body::after{width:42vw;height:42vw;right:-14vw;bottom:-14vw;background:radial-gradient(circle,rgba(132,87,224,.16),transparent 70%);animation:drift2 19s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(8vw,6vw) scale(1.12)}}
  @keyframes drift2{to{transform:translate(-7vw,-5vw) scale(1.1)}}
  .card{
    position:relative;z-index:1;width:100%;max-width:440px;text-align:center;padding:42px 32px;
    background:rgba(253,252,249,.82);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
    border:1px solid rgba(43,36,26,.08);border-radius:26px;
    box-shadow:0 2px 6px rgba(74,60,40,.08),0 24px 54px rgba(74,60,40,.14),inset 0 1px 0 rgba(255,255,255,.9);
    animation:rise .6s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
  .ic{
    width:70px;height:70px;margin:0 auto 24px;border-radius:21px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#39342b,#1a1713);
    box-shadow:0 8px 26px rgba(18,14,8,.32),inset 0 1px 0 rgba(255,255,255,.08);
    animation:pop .6s .08s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  .ic svg{width:34px;height:34px;stroke:#34d399;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* spinning dial hand */
  .ic .hand{transform-origin:12px 12px;animation:spin 3.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:23px;font-weight:800;letter-spacing:-.5px;margin-bottom:10px;
    background:linear-gradient(135deg,#211e18,#059669);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  p{font-size:14.5px;color:#5f584b;line-height:1.65;margin-bottom:22px}
  .dots{display:inline-flex;gap:7px;margin-top:2px}
  .dots i{width:9px;height:9px;border-radius:50%;background:#10b981;opacity:.3;animation:bl 1.4s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  .foot{margin-top:26px;font-size:12px;color:#8a8070;letter-spacing:.3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <div class="card">
    <div class="ic">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path class="hand" d="M12 12V7"></path>
        <path d="M12 12l3.5 2" opacity=".5"></path>
      </svg>
    </div>
    <h1>We&rsquo;ll be right back</h1>
    <p>Our service is briefly undergoing scheduled maintenance.<br>Please check back again in a little while &mdash; thanks for your patience.</p>
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="foot">Scheduled maintenance in progress</div>
  </div>
</body>
</html>
